name: Build and run python tests

on: [push]

jobs:

  build-mac:
    runs-on: macos-latest

    steps:

      - name: Check Secret Presence
        run: |
          if [ -z "${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}" ]; then
            echo "ERROR: The secret GLMNETPP_SUBMODULE_TOKEN is not visible to this runner."
            exit 1
          fi

      - name: Checkout Parent Repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}

      - name: Configure Submodule Auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}@github.com/intro-stat-learning/".insteadOf "git@github.com:intro-stat-learning/"

      - name: Manual Submodule Update
        run: git submodule update --init --recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install .[dev]
          pip install .[gam]

      - name: Test pyglmnet
        run: |
          pip install pytest matplotlib
          pytest tests --test-size=small

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Parent Repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}

      - name: Configure Submodule Auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}@github.com/intro-stat-learning/".insteadOf "git@github.com:intro-stat-learning/"

      - name: Manual Submodule Update
        run: git submodule update --init --recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install .[dev]
          pip install .[gam]

      - name: Test pyglmnet
        run: |
          pip install pytest matplotlib
          pytest tests --test-size=small



  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Parent Repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}

      - name: Configure Submodule Auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}@github.com/intro-stat-learning/".insteadOf "git@github.com:intro-stat-learning/"

      - name: Manual Submodule Update
        run: git submodule update --init --recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # --vsenv: build with MSVC (meson may otherwise pick a MinGW gcc on the
      # PATH, whose runtime DLLs Python doesn't find when importing)
      # TEMPORARY: coxdev 0.3.0's Windows wheels need MinGW DLLs they don't
      # ship; until coxdev 0.3.1, coxdev from its branch with the fix
      # (jonathan-taylor/coxdev#59), built with MSVC
      - name: Install dependencies
        run: |
          pip install "coxdev @ git+https://github.com/jonathan-taylor/coxdev@windows-msvc" -Csetup-args=--vsenv
          pip install ".[dev,gam]" -Csetup-args=--vsenv

      - name: Test pyglmnet
        run: |
          pip install pytest matplotlib
          pytest tests --test-size=small
