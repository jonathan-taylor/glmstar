name: Build and run python tests

# Linux on pull requests; all three systems on pushes to main (merges) and
# by hand. Changes only to the docs or Markdown files do not run the tests.
# The tests are --test-size=small, in parallel; by hand (Actions, "Run
# workflow") they can be --test-size=large, the exhaustive ones.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      test_size:
        description: 'pytest --test-size'
        type: choice
        options: [small, large]
        default: small

# a new push to a branch cancels the run still going for it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_SIZE: ${{ inputs.test_size || 'small' }}
  # one BLAS / OpenMP thread per pytest worker (-n auto: one per core)
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1

jobs:

  build-mac:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest

    steps:

      - name: Check Secret Presence
        run: |
          if [ -z "${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}" ]; then
            echo "ERROR: The secret GLMNETPP_SUBMODULE_TOKEN is not visible to this runner."
            exit 1
          fi

      - name: Checkout Parent Repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}

      - name: Configure Submodule Auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}@github.com/intro-stat-learning/".insteadOf "git@github.com:intro-stat-learning/"

      - name: Manual Submodule Update
        run: git submodule update --init --recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install .[dev]
          pip install .[gam]

      - name: Test pyglmnet
        run: |
          pip install pytest pytest-xdist matplotlib
          pytest tests --test-size=$TEST_SIZE -n auto --dist loadfile --durations=15

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Parent Repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}

      - name: Configure Submodule Auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}@github.com/intro-stat-learning/".insteadOf "git@github.com:intro-stat-learning/"

      - name: Manual Submodule Update
        run: git submodule update --init --recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install .[dev]
          pip install .[gam]

      - name: Test pyglmnet
        run: |
          pip install pytest pytest-xdist matplotlib
          pytest tests --test-size=$TEST_SIZE -n auto --dist loadfile --durations=15



  build-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Parent Repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}

      - name: Configure Submodule Auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}@github.com/intro-stat-learning/".insteadOf "git@github.com:intro-stat-learning/"

      - name: Manual Submodule Update
        run: git submodule update --init --recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # --vsenv: build with MSVC (meson may otherwise pick a MinGW gcc on the
      # PATH, whose runtime DLLs Python doesn't find when importing)
      - name: Install dependencies
        run: |
          pip install ".[dev,gam]" -Csetup-args=--vsenv -Csetup-args=-Db_vscrt=mt

      - name: Test pyglmnet
        run: |
          pip install pytest pytest-xdist matplotlib
          pytest tests --test-size=$TEST_SIZE -n auto --dist loadfile --durations=15
