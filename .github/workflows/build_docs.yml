# This builds the glmstar docs into a folder of the gh-pages branch, one for
# each version: <version>/ for a release (its tag's docs, with its wheel from
# PyPI), dev/ for the branch the workflow is run on (built from source). The
# site's root redirects to the latest release, and versions.html lists them.
#
#   gh workflow run build_docs.yml                       # dev/, from main
#   gh workflow run build_docs.yml -f version=0.7.0      # 0.7.0/, after its PyPI upload

name: Build docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'A release (e.g. 0.7.0), built from its tag and its PyPI wheel; empty for dev/, from source'
        required: false
        default: ''

# one push to gh-pages at a time
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      FOLDER: ${{ inputs.version || 'dev' }}

    steps:
      # a release's docs are those of its tag; glmnetpp (a private submodule)
      # is needed only to build from source
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
          token: ${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}
          submodules: ${{ inputs.version && 'false' || 'recursive' }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # Jupyter Book 2 (mystmd) runs on Node
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The doc and gam extras of the checked-out pyproject.toml, but rpy2:
      # no page runs R (the tests compare with R, not the docs)
      - name: Install dependencies
        run: |
          python - > doc-requirements.txt <<'EOF'
          import tomllib
          extras = tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']
          print('\n'.join(r for r in extras['doc'] + extras.get('gam', [])
                          if not r.startswith('rpy2')))
          EOF
          cat doc-requirements.txt
          if [ -n "$VERSION" ]; then
            pip install "glmstar==$VERSION"
          else
            pip install .
          fi
          pip install -r doc-requirements.txt
          # the data of the GAM page (ISLP's load_data, without its dependencies)
          pip install --no-deps ISLP
          # the glmstar the docs run
          (cd /tmp && python -c "import glmnet, importlib.metadata as m; print(m.version('glmstar'), glmnet.__file__)")

      # The narrative docs: Jupyter Book 2, notebooks executed, served from
      # https://<owner>.github.io/glmstar/<folder>/
      - name: Make book
        env:
          BASE_URL: /${{ github.event.repository.name }}/${{ env.FOLDER }}
        run: |
          cd docs
          # (two pages at a time: all at once runs the runner out of memory)
          jupyter-book build --html --execute --execute-parallel 2 --ci
          test -f _build/html/index.html

      # The API reference: Sphinx autodoc, into api/ next to the book
      - name: Make API reference
        run: |
          sphinx-build -b html docs/api docs/_build/html/api
          test -f docs/_build/html/api/index.html

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: glmstar_docs
          path: docs/_build/html
          retention-days: 5
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write   # to push to gh-pages
    env:
      FOLDER: ${{ inputs.version || 'dev' }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: glmstar_docs
          path: built

      # the folder replaced, then the root redirect and versions.html remade
      # from the folders there
      - name: Push to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git init -q pages && cd pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin gh-pages; then
            git checkout -q -b gh-pages FETCH_HEAD
          else
            git checkout -q --orphan gh-pages
          fi
          rm -rf "$FOLDER"
          cp -r ../built "$FOLDER"
          touch .nojekyll   # (serve the folders starting with _ too)
          python3 - <<'EOF'
          import json, os, re
          releases = sorted((d for d in os.listdir('.') if re.fullmatch(r'\d+\.\d+\.\d+', d)),
                            key=lambda v: tuple(map(int, v.split('.'))), reverse=True)
          folders = releases + (['dev'] if os.path.isdir('dev') else [])
          latest = releases[0] if releases else 'dev'
          json.dump({'latest': latest, 'versions': folders}, open('versions.json', 'w'), indent=1)
          open('index.html', 'w').write(
              f'<!doctype html><meta charset="utf-8"><title>glmstar docs</title>'
              f'<meta http-equiv="refresh" content="0; url={latest}/">'
              f'<p>Redirecting to <a href="{latest}/">the glmstar {latest} docs</a>.'
              f' Other versions: <a href="versions.html">versions.html</a>.</p>')
          # (the docs' absolute links to /glmstar/api/: the latest's)
          os.makedirs('api', exist_ok=True)
          open('api/index.html', 'w').write(
              f'<!doctype html><meta charset="utf-8"><title>glmstar API reference</title>'
              f'<meta http-equiv="refresh" content="0; url=../{latest}/api/">'
              f'<p>Redirecting to <a href="../{latest}/api/">the glmstar {latest} API reference</a>.</p>')
          items = ''.join(f'<li><a href="{v}/">{v}</a>'
                          f'{" (latest release)" if v == latest else ""}'
                          f'{" (main)" if v == "dev" else ""}</li>' for v in folders)
          open('versions.html', 'w').write(
              f'<!doctype html><meta charset="utf-8"><title>glmstar docs: versions</title>'
              f'<h1>glmstar documentation</h1><ul>{items}</ul>')
          EOF
          cat versions.json
          git add -A
          git commit -q -m "Docs for $FOLDER (${GITHUB_SHA::7})"
          git push -q origin gh-pages
