# This builds and deploys glmnet docs

name: Build docs

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs: null
    
# A workflow run is made up of one or more jobs that can run
# sequentially or in parallel

jobs: # This workflow contains a single
      # job called "build"

  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          # Use the PAT to authorize the submodule clone
          token: ${{ secrets.GLMNETPP_SUBMODULE_TOKEN }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Jupyter Book 2 (mystmd) runs on Node
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libtirpc-dev
          sudo apt-get install -y r-base
          pip install .[doc]
          pip install .

      # The narrative docs: Jupyter Book 2, notebooks executed.
      # BASE_URL: the site is served from https://<owner>.github.io/glmstar/
      - name: Make book
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: |
          cd docs
          jupyter-book build --html --execute --ci
          test -f _build/html/index.html

      # The API reference: Sphinx autodoc, into api/ next to the book
      - name: Make API reference
        run: |
          sphinx-build -b html docs/api docs/_build/html/api
          test -f docs/_build/html/api/index.html

      # Store the output
      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: glmstar_docs
          path: docs/_build/html
          retention-days: 5
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
      
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: glmstar_docs
        path: .
    - uses: actions/configure-pages@v5

    - uses: actions/upload-pages-artifact@v3
      with:
        path: .
    - id: deployment
      uses: actions/deploy-pages@v4