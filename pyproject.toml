
[project]
name = "glmstar"
dynamic = ["version"]
authors = [
  {name="Naras Balasubrimanian", email="naras@stanford.edu"},
  {name="Trevor Hastie", email="hastie@stanford.edu"},
  {name="Jonathan Taylor", email="jonathan.taylor@stanford.edu"},
  {name="James Yang", email="jamesyang916@gmail.com"}
]
description = "GlmNet for Python"
readme = "README.md"
requires-python = ">=3.11"
maintainers = [{name="Jonathan Taylor", email="jonathan.taylor@stanford.edu"},]

dependencies = [
    "numpy",
    "scipy>=1.8",
    "pandas>=1.4",
    "scikit-learn>=1.3",
    "joblib",
    "statsmodels>=0.13",
    # 0.3.1: its Windows wheels import (0.3.0's needed MinGW DLLs)
    "coxdev>=0.4.0",
    # glmnet.gam: the smoothing spline and loess terms
    "scatter-smooth>=0.3.0",
    "tqdm",
    "matplotlib",
    # data frames other than pandas (polars, pyarrow...) as inputs
    "narwhals>=1.30",
    # outcome=Outcome(...): the columns of y named by their role
    "modelmatrix>=0.3.1"
]
classifiers = ["Development Status :: 3 - Alpha",
               "Environment :: Console",
               "Intended Audience :: Science/Research",
               "Operating System :: OS Independent",
               "Programming Language :: Python",
               "Topic :: Scientific/Engineering"]
license = "GPL-2.0-only"
license-files = ["LICENSE.txt", "src/glmnetpp/LICENSE.txt"]

[project.optional-dependencies]
# glmnet.gam: smoothing parameters by REML or ML (but for the Cox family)
gam = [
    "jax"
]
dev = [
    "pytest",
    "scipy",
    "ninja",
    "meson",
    "meson-python",
    "pybind11",
    "setuptools_scm"
]
doc = [
    # narrative docs (docs/myst.yml); bundles the Jupyter server and kernel
    "jupyter-book>=2,<3",
    # API reference (docs/api, Sphinx autodoc)
    "sphinx",
    "sphinx-book-theme",
    # used by the notebooks
    "pandas",
    "matplotlib",
    "rpy2",
    "jupytext",
    # the scale-relative tolerance for the active set (lassoinf#29)
    "lassoinf>=0.2.1"
]
test = ["pytest",
        "rpy2",
        "pandas",
	"matplotlib",
	"polars",
	"pyarrow"
	]

[build-system]
requires = ["meson-python>=0.18.0", "pybind11", "coxdev>=0.4.0", "ninja", "patchelf; platform_system == 'Linux'", "setuptools_scm"]
build-backend = "mesonpy"

# Development dependency groups (PEP 735), used by `uv sync`.
# The `dev` group is installed by default, so a plain `uv sync` gives an
# editable install with everything needed to run `uv run pytest`.
[dependency-groups]
build = [
    "meson-python>=0.18.0",
    "coxdev>=0.4.0",
    "meson",
    "ninja",
    "pybind11",
    "setuptools_scm",
    "patchelf; platform_system == 'Linux'",
]
test = [
    "pytest",
    "matplotlib",
    # tests/test_frames.py
    "polars",
    "pyarrow",
]
dev = [
    {include-group = "build"},
    {include-group = "test"},
]

[tool.cibuildwheel]
# no 32-bit builds (no numpy/scipy wheels)
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_i686"]

[tool.cibuildwheel.windows]
# build with MSVC: meson may otherwise pick a MinGW gcc on the PATH, whose
# runtime DLLs the wheel doesn't ship (Python doesn't search the PATH for an
# extension's DLLs). The C++ runtime linked statically (b_vscrt=mt): Python
# ships vcruntime140.dll but not msvcp140.dll, which machines without the
# Visual C++ redistributable lack. And check that the extensions load
config-settings = {setup-args = ["--vsenv", "-Db_vscrt=mt"]}
test-command = "python -c \"import glmnet, glmnet.elnet; from glmnet import GLM, GLMNet; import numpy as np; X = np.random.default_rng(0).standard_normal((50, 3)); GLMNet().fit(X, X @ [1., 0., -1.])\""

[tool.uv]
# meson-python editable installs rebuild the C++ extensions on import, which
# requires the build tools to live in the project environment rather than an
# isolated build environment.
no-build-isolation-package = ["glmstar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# glmnet.gam's REML/ML is experimental, and warns (tested in test_gam_reml.py)
filterwarnings = ["ignore:GAM\\(method=:UserWarning",
                  # the ids of y, deprecated for outcome= (tested in test_outcome.py)
                  "ignore:.*by outcome=:FutureWarning"]
