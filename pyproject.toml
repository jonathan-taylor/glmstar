
[project]
name = "glmstar"
dynamic = ["version"]
authors = [
  {name="Naras Balasubrimanian", email="naras@stanford.edu"},
  {name="Trevor Hastie", email="hastie@stanford.edu"},
  {name="Jonathan Taylor", email="jonathan.taylor@stanford.edu"},
  {name="James Yang", email="jamesyang916@gmail.com"}
]
description = "GlmNet for Python"
readme = "README.md"
requires-python = ">=3.9"
maintainers = [{name="Jonathan Taylor", email="jonathan.taylor@stanford.edu"},]

dependencies = [
    "numpy",
    "scipy>=1.8",
    "pandas",
    "scikit-learn>=1.2",
    "joblib",
    "statsmodels>=0.13",
    "coxdev>=0.1.6",
    "tqdm",
    "mpmath"
]
classifiers = ["Development Status :: 3 - Alpha",
               "Environment :: Console",
               "Intended Audience :: Science/Research",
               "Operating System :: OS Independent",
               "Programming Language :: Python",
               "Topic :: Scientific/Engineering"]
license = "BSD-3-Clause"

[project.optional-dependencies]
dev = [
    "pytest",
    "scipy",
    "ninja",
    "meson",
    "meson-python",
    "pybind11",
    "setuptools_scm"
]
doc = [
    "myst-parser",
    "jupyter-book",
    "pandas",
    "matplotlib",
    "rpy2",
    "texext",
    "numpydoc",
    "myst_nb",
    "sphinx-book-theme",
    "sphinx_rtd_theme",
    "jupytext",
    "jupyter-book",
    "sphinx",
    "myst-parser"
]
test = ["pytest",
        "rpy2",
        "pandas",
	"matplotlib"
	]

[build-system]
requires = ["meson-python>=0.13.1", "pybind11", "ninja", "patchelf; platform_system == 'Linux'", "setuptools_scm"]
build-backend = "mesonpy"

# Development dependency groups (PEP 735), used by `uv sync`.
# The `dev` group is installed by default, so a plain `uv sync` gives an
# editable install with everything needed to run `uv run pytest`.
[dependency-groups]
build = [
    "meson-python>=0.13.1",
    "meson",
    "ninja",
    "pybind11",
    "setuptools_scm",
    "patchelf; platform_system == 'Linux'",
]
test = [
    "pytest",
    "matplotlib",
]
dev = [
    {include-group = "build"},
    {include-group = "test"},
]

[tool.uv]
# meson-python editable installs rebuild the C++ extensions on import, which
# requires the build tools to live in the project environment rather than an
# isolated build environment.
no-build-isolation-package = ["glmstar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
